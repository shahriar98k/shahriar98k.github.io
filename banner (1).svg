  <style>
    text{font-family:'Helvetica Neue',Arial,sans-serif}
    .label{font-weight:700;font-size:13px;letter-spacing:.24em;fill:#D4AF5A}
    .head{font-weight:800;font-size:50px;letter-spacing:-.02em;fill:#EDE8DB}
    .sub{font-size:18px;fill:#9FB0C3}
    .b{font-weight:700;font-size:20px;fill:#EDE8DB}
    .m{font-size:16px;fill:#9FB0C3}
    .goal{font-size:18px;fill:#9FB0C3}
    .card{fill:#10233A;stroke:#22384F;stroke-width:1.5}
    .num{font-weight:800;font-size:38px;fill:#E3C170}
    .cap{font-size:14px;fill:#D5DDE6}
    .bar{fill:url(#gold);transform-box:fill-box;transform-origin:50% 100%;animation:grow 6s cubic-bezier(.16,1,.3,1) infinite}
    @keyframes grow{0%{transform:scaleY(0)}18%{transform:scaleY(1)}86%{transform:scaleY(1)}100%{transform:scaleY(0)}}
    .line{fill:none;stroke:#7CC5B8;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 6s ease-in-out infinite}
    @keyframes draw{0%,10%{stroke-dashoffset:1}40%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
    .dot{fill:#7CC5B8;opacity:0;animation:pop 6s ease-in-out infinite}
    @keyframes pop{0%,38%{opacity:0}46%,86%{opacity:1}100%{opacity:0}}
    .in{opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .ball{animation:bounce 1.8s cubic-bezier(.3,0,.5,1) infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
    .shadow{transform-box:fill-box;transform-origin:50% 50%;animation:squash 1.8s cubic-bezier(.3,0,.5,1) infinite}
    @keyframes squash{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(.6);opacity:.15}}
    .tw{animation:twinkle 3s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}
    .pin{animation:drop 2.6s ease-in-out infinite}
    @keyframes drop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @media (prefers-reduced-motion:reduce){.bar,.line,.dot,.ball,.shadow,.tw,.pin{animation:none}.line{stroke-dashoffset:0}.dot{opacity:1}.in{animation:none;opacity:1}}
  </style>

