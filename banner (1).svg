<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Shahriar, SEO Specialist</title>
  <desc id="d">SEO specialist and management trainee in apparel, based in Dhaka, Bangladesh. Studied apparel engineering and garments business. Football fan: Barcelona, Messi, Argentina. Next goal: a sustainable luxury fashion house.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1626"/><stop offset="1" stop-color="#10233A"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#B8902A"/><stop offset="1" stop-color="#E3C170"/></linearGradient>
    <pattern id="barca" width="48" height="10" patternUnits="userSpaceOnUse"><rect width="24" height="10" fill="#004D98"/><rect x="24" width="24" height="10" fill="#A50044"/></pattern>
    <pattern id="arg" width="48" height="10" patternUnits="userSpaceOnUse"><rect width="24" height="10" fill="#74ACDF"/><rect x="24" width="24" height="10" fill="#FFFFFF"/></pattern>
    <clipPath id="c4"><rect x="40" y="465" width="1120" height="160" rx="14"/></clipPath>
